name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install deps
        run: pnpm install

      - name: Lint
        run: pnpm run lint

  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        node: [24.x]
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Set node ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install deps
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Preserve Vitest worker exit diagnostics
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vitestPool = Get-ChildItem -Path 'node_modules/.pnpm/vitest@4.1.5_*/node_modules/vitest/dist/chunks/cli-api.*.js' | Select-Object -First 1
          if (-not $vitestPool) {
            throw 'Unable to locate the Vitest pool implementation'
          }

          $content = [System.IO.File]::ReadAllText($vitestPool.FullName)
          $patched = $content.Replace(
            'emitUnexpectedExit = () => {',
            'emitUnexpectedExit = (code, signal) => { console.error("[vitest-worker-exit]", { code, signal });'
          )
          if ($patched -eq $content) {
            throw 'Unable to patch the Vitest worker exit handler'
          }

          [System.IO.File]::WriteAllText(
            $vitestPool.FullName,
            $patched,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Test
        run: pnpm run test
